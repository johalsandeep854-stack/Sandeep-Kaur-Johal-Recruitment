<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Find a Job | Sandeep Kaur Johal Recruitment
    </title>


    <!-- =========================
         LAYER 1: CSS
    ========================== -->

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            color: #222;
        }


        header {
            background: #0b1f3a;
            color: white;
            padding: 20px;
            text-align: center;
        }


        nav {
            margin-top: 15px;
        }


        nav a {
            color: white;
            text-decoration: none;
            margin: 0 10px;
        }


        nav a:hover {
            color: #f4b942;
        }


        .hero {
            background: #173f6f;
            color: white;
            text-align: center;
            padding: 60px 20px;
        }


        .container {
            max-width: 1100px;
            margin: auto;
            padding: 40px 20px;
        }


        .search-box {
            background: white;
            padding: 25px;
            border-radius: 10px;
            margin-bottom: 30px;
        }


        .search-box input,
        .search-box select {
            padding: 12px;
            margin: 5px;
        }


        button {
            padding: 12px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }


        .search-button {
            background: #f4b942;
        }


        .jobs {
            display: grid;
            grid-template-columns:
                repeat(2, 1fr);

            gap: 20px;
        }


        .job-card {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow:
                0 5px 15px
                rgba(0,0,0,0.08);
        }


        .job-card h3 {
            color: #0b1f3a;
        }


        .job-card p {
            color: #555;
        }


        .apply-button {
            background: #0b1f3a;
            color: white;
        }


        footer {
            background: #071528;
            color: white;
            text-align: center;
            padding: 20px;
            margin-top: 40px;
        }


        @media (max-width: 700px) {

            .jobs {
                grid-template-columns: 1fr;
            }

            nav a {
                display: block;
                margin: 8px;
            }

        }

    </style>

</head>


<body>


    <!-- =========================
         LAYER 2: HTML STRUCTURE
    ========================== -->


    <header>

        <h1>
            Sandeep Kaur Johal Recruitment
        </h1>


        <nav>

            <a href="index.html">
                Home
            </a>

            <a href="jobs.html">
                Find a Job
            </a>

            <a href="post-job.html">
                Post a Job
            </a>

            <a href="career-advice.html">
                Career Advice
            </a>

            <a href="about.html">
                About Us
            </a>

            <a href="contact.html">
                Contact
            </a>

        </nav>

    </header>


    <section class="hero">

        <h2>
            Find Your Next Job
        </h2>

        <p>
            Search for the right opportunity
            for your career.
        </p>

    </section>


    <main class="container">


        <!-- SEARCH LAYER -->

        <section class="search-box">

            <h2>
                Search Jobs
            </h2>


            <input
                type="text"
                id="search"
                placeholder="Search job title"
            >


            <select id="location">

                <option value="">
                    All Locations
                </option>

                <option value="Jalandhar">
                    Jalandhar
                </option>

                <option value="Punjab">
                    Punjab
                </option>

                <option value="Remote">
                    Remote
                </option>

            </select>


            <button
                class="search-button"
                onclick="searchJobs()"
            >
                Search
            </button>

        </section>


        <!-- JOBS LAYER -->

        <section>

            <h2>
                Available Jobs
            </h2>


            <div
                class="jobs"
                id="jobsContainer"
            >

            </div>

        </section>


    </main>


    <footer>

        <p>
            © 2026 Sandeep Kaur Johal Recruitment
        </p>

    </footer>


    <!-- =========================
         LAYER 3: JAVASCRIPT
    ========================== -->


    <script>


        const jobs = [

            {
                title:
                    "Sales & Marketing Executive",

                company:
                    "Sandeep Kaur Johal Recruitment",

                location:
                    "Jalandhar",

                salary:
                    "₹20,000 - ₹35,000",

                experience:
                    "0 - 3 Years"
            },


            {
                title:
                    "IT Support Executive",

                company:
                    "Sandeep Kaur Johal Recruitment",

                location:
                    "Punjab",

                salary:
                    "₹25,000 - ₹40,000",

                experience:
                    "1 - 3 Years"
            },


            {
                title:
                    "Business Development Executive",

                company:
                    "Sandeep Kaur Johal Recruitment",

                location:
                    "Jalandhar",

                salary:
                    "₹25,000 - ₹45,000",

                experience:
                    "1 - 4 Years"
            }

        ];


        function displayJobs(jobList) {

            const container =
                document.getElementById(
                    "jobsContainer"
                );


            container.innerHTML = "";


            jobList.forEach(function(job) {

                container.innerHTML += `

                    <div class="job-card">

                        <h3>
                            ${job.title}
                        </h3>

                        <p>
                            <strong>
                                Company:
                            </strong>

                            ${job.company}
                        </p>


                        <p>
                            <strong>
                                Location:
                            </strong>

                            ${job.location}
                        </p>


                        <p>
                            <strong>
                                Salary:
                            </strong>

                            ${job.salary}
                        </p>


                        <p>
                            <strong>
                                Experience:
                            </strong>

                            ${job.experience}
                        </p>


                        <button
                            class="apply-button"
                            onclick="applyJob()"
                        >
                            Apply Now
                        </button>

                    </div>

                `;

            });

        }


        function searchJobs() {

            const keyword =
                document
                    .getElementById("search")
                    .value
                    .toLowerCase();


            const location =
                document
                    .getElementById("location")
                    .value;


            const results =
                jobs.filter(function(job) {

                    const titleMatch =
                        job.title
                            .toLowerCase()
                            .includes(keyword);


                    const locationMatch =
                        location === ""
                        ||
                        job.location === location;


                    return (
                        titleMatch
                        &&
                        locationMatch
                    );

                });


            displayJobs(results);

        }


        function applyJob() {

            alert(
                "Candidate application system will be connected next."
            );

        }


        displayJobs(jobs);


    </script>


</body>

</html>
